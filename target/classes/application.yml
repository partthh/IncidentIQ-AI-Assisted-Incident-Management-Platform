spring:
  application:
    name: sentinel-ai

  datasource:
    url: ${SENTINEL_DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SENTINEL_DB_USER:sentinel}
    password: ${SENTINEL_DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: ${SENTINEL_DB_POOL_SIZE:20}
      pool-name: sentinel-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates that it matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SENTINEL_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

sentinel:
  security:
    jwt-secret: ${SENTINEL_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    access-token-ttl: 12h
    issuer: sentinel-ai
  ingestion:
    max-payload-bytes: 65536
    max-message-length: 4000
    max-metadata-entries: 40
    auto-investigate: true
    max-active-incidents-per-service: 25
  detection:
    # Minutes an incident fingerprint stays open before a repeat occurrence is treated as new.
    incident-reuse-cooldown: 30m
    # Seconds within which a downstream symptom is correlated into an already-open incident.
    correlation-window: 120s
    auto-investigate-after-events: 5
  investigation:
    provider: ${SENTINEL_LLM_PROVIDER:stub}
    model: ${SENTINEL_LLM_MODEL:sentinel-stub-v1}
    prompt-version: v1
    openai-base-url: ${SENTINEL_LLM_BASE_URL:https://api.openai.com/v1}
    openai-api-key: ${SENTINEL_LLM_API_KEY:}
    request-timeout: 20s
    max-attempts: 3
    retry-backoff: 2s
    # @Scheduled's fixedDelayString accepts an ISO-8601 duration or a bare
    # millisecond count, so the poll interval is expressed in milliseconds here
    # while the rest of this block stays Duration-typed.
    poll-interval-ms: ${SENTINEL_LLM_POLL_INTERVAL_MS:1000}
    max-batch-size: 5
    max-evidence-events: 40
    max-evidence-chars: 12000
    max-raw-tokens: 4000
    # Only the offline stub honours these. They exist so provider failure modes
    # (timeout, 429, 503, malformed output, hijacked output) can be demonstrated
    # and tested deterministically, with no network and no API key.
    stub-latency-ms: 120
    stub-failure-mode: ${SENTINEL_LLM_STUB_FAILURE_MODE:}
    # The queue worker. Disabled in tests that assert on queued state directly, so a
    # scheduled poll cannot race the assertion.
    job-processor-enabled: true
  realtime:
    enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{userId:-}]"
  level:
    com.sentinelai: INFO
    org.hibernate.SQL: WARN

app:
  seed:
    enabled: true
    password: ${SENTINEL_SEED_PASSWORD:sentinel123}
